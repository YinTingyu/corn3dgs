[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "corn3dgs"
version = "0.1.0"
description = "Corn seedling biomass from 3D Gaussian splatting point clouds, with the leaf photo and light meter analyses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plyfile>=1.0",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
corn3dgs = "corn3dgs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
